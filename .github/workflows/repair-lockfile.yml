name: Repair npm lockfile (one time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate package-lock.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const l=require('./package-lock.json'); if (!l.lockfileVersion || !l.packages) process.exit(1)"
      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: regenerate valid npm lockfile for Cloudflare"
            git push
          fi
